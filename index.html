<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">

    <title>Página de cadastro</title>
</head>
<body>
    <Section class="container g-0">
        <div class="logo">
                <svg  xmlns="http://www.w3.org/2000/svg" width="22" height="22"  
                fill="currentColor" viewBox="0 0 24 24" >
                <!--Boxicons v3.0 https://boxicons.com | License  https://docs.boxicons.com/free-->
                <path d="m5.78,19.83c1.17.93,2.56,1.6,4.01,1.93l.44-1.95c-1.16-.26-2.27-.79-3.21-1.54l-1.25,1.56Z"></path><path d="m2,12.02c0,1.52.34,2.98,1,4.34l1.8-.87c-.53-1.08-.79-2.25-.8-3.47h-2Z"></path><path d="m13.79,19.8l.44,1.95c1.45-.33,2.84-1,4.01-1.93l-1.25-1.56c-.93.75-2.04,1.28-3.2,1.55Z"></path><path d="m19.21,15.47l1.8.87c.66-1.36.99-2.82.99-4.3v-.08s-2,.04-2,.04c0,1.22-.27,2.38-.79,3.47Z"></path><path d="m18.21,4.16l-1.24,1.57c.94.74,1.71,1.7,2.23,2.77l1.8-.88c-.65-1.34-1.62-2.54-2.79-3.47Z"></path><path d="m13.76,4.19l.44-1.95c-1.45-.33-3-.32-4.45.01l.45,1.95c1.16-.27,2.4-.27,3.56-.01Z"></path><path d="m7,5.76l-1.25-1.56c-1.17.94-2.12,2.14-2.77,3.48l1.8.87c.52-1.07,1.28-2.04,2.21-2.79Z"></path><path d="m18,12c0-3.31-2.69-6-6-6s-6,2.69-6,6,2.69,6,6,6,6-2.69,6-6Zm-6,4c-2.21,0-4-1.79-4-4s1.79-4,4-4,4,1.79,4,4-1.79,4-4,4Z"></path>
                </svg>
                <h1 class="h4">Company name</h1>
            </div>
        <div class="conteudo">
            <h2 class="h1">Cadastre-se</h2>
            <div class="formulario">
                <form>
                    <input class="form-control" type="text" id="nome" placeholder="Nome Sobrenome" required>

                    <input class="form-control" id="email" type="text" placeholder="name@example.com" required>

                    <input class="form-control" type="tel" id="tel" placeholder="(xx) xxxxx-xxxx " pattern="^\([0-2]{2}\)[0-9]{4,5}-[0-9]{4}$" required>

                    <div class="form-check form-switch">
                        <label class="form-check-label" for="aceito-termos">Li e concordo com os termos do site.</label>
                        <input class="form-check-input" type="checkbox" id="aceito-termos">
                    </div>

                    <button class="btn btn-primary" type="submit">Enviar</button>

                    <a href="#">Já tem uma conta?</a>

                </form>
            </div>
        </div>

    </Section>
</body>
</html>
