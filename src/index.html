<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOKENPÔ</title>
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1>Pedra, Papel ou Tesoura!</h1>
    <h2 id="frase">Escolha uma opção:</h2>

    <div id="area-escolha">
        <img id="pedra" onclick="select(0)" src="images/pedra.png">
        <img id="papel" onclick="select(1)" src="images/papel.png">
        <img id="tesoura" onclick="select(2)" src="images/tesoura.png">
    </div>

    <div id="area-res">
        <img id="jogador" src="images/papel.png">
        <img id="pc" src="images/papel-pc.png">
        <br>
        <button id="botao" onclick="location.reload(true)" >Recomeçar</button>
    </div>

    <script src="@@ENDERECO_DO_JS"></script>
</body>

</html>
